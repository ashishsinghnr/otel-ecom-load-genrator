# Collector config for the local pipeline: accept OTLP, forward traces to
# Jaeger, and log a sample of every signal so you can confirm arrival from
# `docker compose logs collector`.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s

exporters:
  # Traces to Jaeger over OTLP.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Metrics for Prometheus to scrape.
  prometheus:
    endpoint: 0.0.0.0:8889

  # Console output, so a smoke run can be verified without a UI.
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
